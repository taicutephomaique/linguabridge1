
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaBridge - Học và phiên dịch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🌐 LinguaBridge</div>
    <p>Học ngoại ngữ thông minh mỗi ngày</p>
  </header>

  <main>
    <section class="hero">
      <h1>Khám phá thế giới ngôn ngữ</h1>
      <p>Dịch thuật và luyện tập 4 kỹ năng trên một website.</p>
    </section>

    <section class="panel">
      <h2>🌍 Phiên dịch đa ngôn ngữ</h2>
      <div class="languages">
        <div>
          <label for="source">Ngôn ngữ gốc</label>
          <select id="source">
            <option value="vi">🇻🇳 Tiếng Việt</option>
            <option value="en">🇬🇧 Tiếng Anh</option>
            <option value="zh-CN">🇨🇳 Tiếng Trung</option>
            <option value="ja">🇯🇵 Tiếng Nhật</option>
            <option value="de">🇩🇪 Tiếng Đức</option>
            <option value="ko">🇰🇷 Tiếng Hàn</option>
          </select>
        </div>
        <button id="swap" class="swap" title="Đổi ngôn ngữ">⇄</button>
        <div>
          <label for="target">Dịch sang</label>
          <select id="target">
            <option value="en">🇬🇧 Tiếng Anh</option>
            <option value="vi">🇻🇳 Tiếng Việt</option>
            <option value="zh-CN">🇨🇳 Tiếng Trung</option>
            <option value="ja">🇯🇵 Tiếng Nhật</option>
            <option value="de">🇩🇪 Tiếng Đức</option>
            <option value="ko">🇰🇷 Tiếng Hàn</option>
          </select>
        </div>
      </div>

      <div class="translation-grid">
        <div>
          <label for="original">Văn bản cần dịch</label>
          <textarea id="original" placeholder="Nhập câu cần dịch..."></textarea>
          <div class="actions">
            <button id="speakSource" class="secondary">🔊 Nghe</button>
            <button id="mic" class="secondary">🎤 Nói</button>
          </div>
        </div>
        <div>
          <label for="translated">Kết quả dịch</label>
          <textarea id="translated" readonly placeholder="Bản dịch hiển thị ở đây"></textarea>
          <div class="actions">
            <button id="speakTarget" class="secondary">🔊 Nghe bản dịch</button>
            <button id="copy" class="secondary">📋 Sao chép</button>
          </div>
        </div>
      </div>

      <button id="translate" class="primary">✨ Dịch ngay</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>📚 Luyện tập 4 kỹ năng</h2>
      <div class="skill-grid">
        <button class="skill" data-skill="reading">📖<strong>Reading</strong><span>Đọc hiểu</span></button>
        <button class="skill" data-skill="listening">🎧<strong>Listening</strong><span>Luyện nghe</span></button>
        <button class="skill" data-skill="speaking">🎤<strong>Speaking</strong><span>Luyện nói</span></button>
        <button class="skill" data-skill="writing">✍️<strong>Writing</strong><span>Luyện viết</span></button>
      </div>
      <div id="exercise" class="exercise" aria-live="polite">
        Chọn một kỹ năng để bắt đầu.
      </div>
    </section>
  </main>

  <footer>LinguaBridge © 2026 — Learn without limits</footer>
  <script src="script.js"></script>
</body>
</html>
